    - row "8 Initech":
      - gridcell "8"
      - gridcell "Initech"
    - row "9 Umbrella":
      - gridcell "9"
      - gridcell "Umbrella"
    - row /\d+ Hooli/:
      - gridcell /\d+/
      - gridcell "Hooli"
