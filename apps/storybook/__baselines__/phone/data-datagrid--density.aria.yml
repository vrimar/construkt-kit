- paragraph: compact
- grid "Invoices, compact":
  - rowgroup:
    - row "# Customer":
      - columnheader "#"
      - columnheader "Customer"
  - rowgroup:
    - row "0 Acme Corporation":
      - gridcell "0"
      - gridcell "Acme Corporation"
    - row "1 Globex":
      - gridcell "1"
      - gridcell "Globex"
