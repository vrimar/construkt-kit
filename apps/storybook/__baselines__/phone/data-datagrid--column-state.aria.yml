- button "Restore view" [disabled]
- grid "Invoices":
  - rowgroup:
    - row "# Customer Region Status":
      - columnheader "#"
      - columnheader "Customer"
      - columnheader "Region"
      - columnheader "Status"
  - rowgroup:
    - row "0 Acme Corporation North paid":
      - gridcell "0"
      - gridcell "Acme Corporation"
      - gridcell "North"
      - gridcell "paid"
