- main:
  - article:
    - text: How-to
    - heading "Roles and permissions" [level=1]
    - paragraph: A role is a set of permissions, and everyone in a project has one.
    - paragraph: Every project starts with an Owner role. Add roles beside it to give people less access.
    - paragraph: Tip
    - paragraph: A person's role applies to every page in the project.
    - heading "Add a role" [level=2]:
      - text: ""
      - link "Copy link to this section":
        - /url: "#add-a-role"
        - text: "#"
    - list:
      - listitem: Open the project menu.
      - listitem:
        - text: Choose
        - strong: Add role
        - text: .
    - heading "From a template" [level=3]:
      - text: ""
      - link "Copy link to this section":
        - /url: "#from-a-template"
        - text: "#"
    - paragraph: Pick a template from the list. Each permission becomes a switch; press Esc to cancel.
    - heading "Reorder roles" [level=2]:
      - text: ""
      - link "Copy link to this section":
        - /url: "#reorder-roles"
        - text: "#"
    - paragraph:
      - text: Drag a role by its handle.
      - code: Owner
      - text: always stays first.
    - heading "Limits" [level=2]:
      - text: ""
      - link "Copy link to this section":
        - /url: "#limits"
        - text: "#"
    - table:
      - rowgroup:
        - row "What Limit":
          - columnheader "What"
          - columnheader "Limit"
      - rowgroup:
        - row /Roles per project \d+/:
          - cell "Roles per project"
          - cell /\d+/
    - time: /Updated 2 Mar \d+/
