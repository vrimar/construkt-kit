- paragraph: "Drag a header edge to resize, double-click it to reset. Widths: {}"
- table:
  - rowgroup:
    - row "ID Name Email Role Created At actions":
      - columnheader "ID":
        - paragraph: ID
        - button "Sort by ID"
        - separator "Resize ID"
      - columnheader "Name":
        - paragraph: Name
        - button "Sort by Name"
        - separator "Resize Name"
      - columnheader "Email":
        - paragraph: Email
        - button "Sort by Email"
        - separator "Resize Email"
      - columnheader "Role":
        - paragraph: Role
        - button "Sort by Role"
        - separator "Resize Role"
      - columnheader "Created At":
        - paragraph: Created At
        - button "Sort by Created At"
        - separator "Resize Created At"
      - columnheader "actions":
        - paragraph
        - text: ""
    - row "Equals Filter by Role Filter by Created At":
      - cell "Equals":
        - button "Equals": =
        - textbox "Filter by ID"
      - cell:
        - textbox "Filter by Name"
      - cell:
        - textbox "Filter by Email"
      - cell "Filter by Role":
        - button "Filter by Role"
      - cell "Filter by Created At":
        - button "Filter by Created At"
        - alert
      - cell
