- grid "Invoices with flexible columns":
  - rowgroup:
    - row "# Customer Region Amount":
      - columnheader "#"
      - columnheader "Customer"
      - columnheader "Region"
      - columnheader "Amount"
  - rowgroup:
    - row "0 Acme Corporation North 0":
      - gridcell "0"
      - gridcell "Acme Corporation"
      - gridcell "North"
      - gridcell "0"
    - row /1 Globex West \d+\.\d+/:
      - gridcell "1"
      - gridcell "Globex"
      - gridcell "West"
      - gridcell /\d+\.\d+/
    - row /2 Initech East \d+\.\d+/:
      - gridcell "2"
      - gridcell "Initech"
      - gridcell "East"
      - gridcell /\d+\.\d+/
