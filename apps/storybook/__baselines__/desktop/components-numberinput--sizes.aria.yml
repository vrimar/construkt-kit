- table:
  - rowgroup:
    - row "Size Preview":
      - columnheader "Size"
      - columnheader "Preview"
  - rowgroup:
    - row /sm Quantity \d+/:
      - cell "sm"
      - cell /Quantity \d+/:
        - text: ""
        - spinbutton "Quantity": /\d+/
        - group:
          - button "increment value"
          - button "decrease value"
