- paragraph: Invoices
- grid "Invoices":
  - rowgroup:
    - row "# Customer Region Status Amount Issued":
      - columnheader "#"
      - columnheader "Customer"
      - columnheader "Region"
      - columnheader "Status"
      - columnheader "Amount"
      - columnheader "Issued"
  - rowgroup:
    - row /0 Acme Corporation North paid \$\d+\.\d+ \d+-\d+-\d+/:
      - gridcell "0"
      - gridcell "Acme Corporation"
      - gridcell "North"
      - gridcell "paid"
      - gridcell /\$\d+\.\d+/
      - gridcell /\d+-\d+-\d+/
