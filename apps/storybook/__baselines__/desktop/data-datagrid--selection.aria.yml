- button "Flash a cell"
- paragraph: Nothing selected
- grid "Selection":
  - rowgroup:
    - 'row "Select all rows # Customer Region Status Amount Issued"':
      - columnheader "Select all rows":
        - checkbox "Select all rows"
      - columnheader "#"
      - columnheader "Customer"
      - columnheader "Region"
      - columnheader "Status"
      - columnheader "Amount"
      - columnheader "Issued"
