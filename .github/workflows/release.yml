name: Release

on:
  push:
    tags:
      - "release-*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json status,conclusion --jq '[.[] | select(.status == "completed")][0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA (latest finished run: $conclusion). Push the commit, wait for CI to go green, then tag it."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The publish script creates an annotated tag per package.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to npm
        run: pnpm run release

      - name: Push package tags
        run: |
          git push origin 'refs/tags/@construkt-kit/*:refs/tags/@construkt-kit/*'
