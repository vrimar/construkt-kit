name: Release

on:
  push:
    tags:
      - "release-*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Wait for green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs

  publish:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Restored only once CI is green, so the cache CI saved for this commit is there.
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache: restore

      # The publish script creates an annotated tag per package.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to npm and push package tags
        run: pnpm run release --push-tags
