name: Release

on:
  push:
    tags:
      - "release-*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Wait for green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The publish script creates an annotated tag per package.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to npm
        run: pnpm run release

      - name: Push package tags
        run: |
          git push origin 'refs/tags/@construkt-kit/*:refs/tags/@construkt-kit/*'
