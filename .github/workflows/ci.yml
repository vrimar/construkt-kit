name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @construkt-kit/data-grid exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format --check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run //#lint typecheck test test:browser build

      - name: Check preset CSS, dependencies and story coverage
        run: pnpm check:css && pnpm check:deps && pnpm check:stories

      - name: Story tests
        env:
          STORIES_PIXELS: required
        run: pnpm test:stories

      - name: Upload story report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stories-report
          path: apps/storybook/.stories-report/
          if-no-files-found: ignore

      - name: Check baseline signatures
        env:
          STORIES_BASELINE_SIGNER: ${{ vars.STORIES_BASELINE_SIGNER }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-baseline-signature.mjs

      - name: Summarise story test guardrails
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/guardrail-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Validate package exports
        run: pnpm turbo run check:exports
