name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Every main commit runs to completion: a release may be gated on any of them.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - name: Checkout the browser pin
        uses: actions/checkout@v7
        with:
          sparse-checkout: packages/story-kit/browser-image.json
          sparse-checkout-cone-mode: false

      - name: Read the pinned image
        id: read
        run: echo "ref=$(jq -r '.image + "@" + .digest' packages/story-kit/browser-image.json)" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache: save

      - name: Verify
        run: pnpm verify:node

      - name: Check baseline commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm exec story-kit baseline-commits

      - name: Summarise story test guardrails
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm exec story-kit guardrails >> "$GITHUB_STEP_SUMMARY"

      - name: Prune Turbo cache entries older than a week
        run: find .turbo/cache -type f -mtime +7 -delete

  browser:
    name: browser (${{ matrix.package }}, ${{ matrix.engine }})
    needs: browser-image
    runs-on: ubuntu-latest
    container: ${{ needs.browser-image.outputs.ref }}
    strategy:
      fail-fast: false
      matrix:
        package: [ui, data-grid]
        engine: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache: restore

      - name: Browser tests
        # Firefox refuses to run as root under a HOME another user owns, as the image's /github/home is.
        env:
          HOME: /root
          CONSTRUKT_KIT_BROWSER_ENGINES: ${{ matrix.engine }}
        run: pnpm test:browser --filter=@construkt-kit/${{ matrix.package }}

      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures-${{ matrix.package }}-${{ matrix.engine }}
          path: packages/${{ matrix.package }}/.vitest/attachments/
          include-hidden-files: true
          if-no-files-found: ignore

  stories:
    name: stories (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache: restore

      - name: Story tests
        env:
          STORIES_PIXELS: required
        run: pnpm test:stories --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload story report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stories-report-${{ matrix.shard }}
          path: apps/storybook/.stories-report/
          include-hidden-files: true
          if-no-files-found: ignore
