name: Set up the workspace
description: Install pnpm and Node.js, restore the Turbo cache and install dependencies.

inputs:
  turbo-cache:
    description: "`save` restores the Turbo cache and saves it when the job ends, `restore` only restores it, `none` skips it."
    default: none
  install:
    description: Install the workspace dependencies.
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - name: Turbo cache
      if: inputs.turbo-cache == 'save'
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-

    - name: Restore Turbo cache
      if: inputs.turbo-cache == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
