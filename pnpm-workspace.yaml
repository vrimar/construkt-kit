packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  es5-ext: false
  esbuild: true
  # Transitive optional peer of @vitest/mocker; its postinstall only copies the browser
  # service worker, which nothing here uses.
  msw: false

# pnpm 11 enables a supply-chain delay by default; disabled to allow latest releases
minimumReleaseAge: 0

overrides:
  pkg-types: 2.3.1
  ts-evaluator: 2.0.0
  # tsdown's dts plugin needs the classic TS compiler API, which typescript@7 dropped; pin it to the last JS-based line
  rolldown-plugin-dts>typescript: 6.0.2
