packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': false
  es5-ext: false
  esbuild: true
  # Transitive optional peer of @vitest/mocker; its postinstall only copies the browser
  # service worker, which nothing here uses.
  msw: false

# pnpm 11 enables a supply-chain delay by default; disabled to allow latest releases
minimumReleaseAge: 0

overrides:
  # @kubb/plugin-* import PluginFactoryOptions from kubb/kit, which exports it only up to 5.9.0
  kubb: 5.9.0
  '@kubb/adapter-oas': 5.9.0
  '@kubb/parser-ts': 5.9.0
